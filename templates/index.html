<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTS Google Login</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 1.25rem; }
    button { padding: 0.6rem 1rem; border-radius: 8px; border: 0; background: #1a73e8; color: #fff; cursor: pointer; }
    img { border-radius: 999px; }
  </style>
</head>
<body>
  <h1>Googleログイン最小実装</h1>
  <div class="card">
    {% if user %}
      <p><strong>ログイン済み</strong></p>
      <p>名前: {{ user.name }}</p>
      <p>メール: {{ user.email }}</p>
      {% if user.avatar_url %}
      <p><img src="{{ user.avatar_url }}" alt="avatar" width="48" height="48"></p>
      {% endif %}
      <form method="post" action="/auth/google/logout">
        <button type="submit">ログアウト</button>
      </form>
    {% else %}
      <p>未ログインです。</p>
      <a href="/auth/google/login"><button type="button">Googleでログイン</button></a>
    {% endif %}
  </div>
</body>
</html>
